<template>
    <div class="card">
        <template if:true={title}>
            <p class="headline">{title}</p>
        </template>
        <template if:true={hasMap}>
            <a href={link} target="_blank" rel="noopener noreferrer" title="Open this route in Google Maps">
                <img src={image} alt="Route from the warehouse through the parcel's current position to the delivery address" class="map" />
            </a>
        </template>
        <template if:true={caption}>
            <p class="subtext">{caption}</p>
        </template>
    </div>
</template>
